name: Linux

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config gettext autopoint \
            libavcodec-dev libavformat-dev libavutil-dev \
            libwxgtk3.2-dev wx-common

      - name: Build
        run: |
          ./autogen.sh
          make -j"$(nproc)"
          make -C po update-gmo

      - name: Smoke test
        run: |
          file src/spek
          ./src/spek --version

      - name: Package binary
        run: |
          mkdir -p out
          cp src/spek out/spek-${{ matrix.arch }}
          tar -C out -czf spek-linux-${{ matrix.arch }}.tar.gz spek-${{ matrix.arch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: spek-linux-${{ matrix.arch }}
          path: spek-linux-${{ matrix.arch }}.tar.gz
          if-no-files-found: error

  release:
    name: Attach Linux binaries to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.gz
          fail_on_unmatched_files: true
