name: macOS

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install automake libtool coreutils pkg-config wxwidgets gettext ffmpeg

      - name: Build bundle
        run: ./dist/osx/bundle.sh

      - name: Verify bundle
        run: |
          file dist/osx/Spek.app/Contents/MacOS/Spek | tee /dev/stderr | grep -q "${{ matrix.arch }}"
          codesign -dvv dist/osx/Spek.app
          dist/osx/Spek.app/Contents/MacOS/Spek --version

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Spek-${{ matrix.arch }}
          path: dist/osx/Spek-${{ matrix.arch }}.dmg
          if-no-files-found: error

  release:
    name: Attach DMGs to release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.dmg
          fail_on_unmatched_files: true
